<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>hvelf</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="board">
    <div id="head">
      <img id="mark" src="icon.png" alt="" draggable="false" />
      <span id="wordmark">hvelf</span>
      <input id="filter" type="text" placeholder="type to filter, Esc to dismiss" autocomplete="off" spellcheck="false" />
    </div>
    <div id="groups"></div>
    <div id="hint">1–9 launch · Enter first match · Ctrl+Q quit</div>
  </div>
  <script src="main.js"></script>
</body>
</html>
