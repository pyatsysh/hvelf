[package]
name = "hvelf"
version = "0.1.0"
description = "Hotkey-summoned tile board for launching Obsidian vaults"
authors = ["Peter Yatsyshin"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: hiding a vault edits the user's config.json in place.
serde_json = { version = "1", features = ["preserve_order"] }
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
