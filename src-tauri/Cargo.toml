[package]
name = "hvelf"
version = "0.1.0"
description = "Hotkey-summoned tile board for launching Obsidian vaults"
authors = ["Peter Yatsyshin"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: hiding a vault edits the user's config.json in place.
serde_json = { version = "1", features = ["preserve_order"] }
urlencoding = "2"
toml = "0.8"
sha2 = "0.10"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
# COM-level UI Automation, for reading a selection without the clipboard.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }

# Linux desktop adapters: x11rb speaks the X protocol in pure Rust for EWMH
# window observation and key grabs; zbus (already pulled in by the
# single-instance plugin) probes the GlobalShortcuts portal.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
