name: Build and draft release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node --test .github/scripts/release.test.mjs
      - id: version
        run: node .github/scripts/release.mjs check

  build:
    needs: version
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundle: deb
          - os: windows-2022
            platform: windows-x86_64
            bundle: nsis
          - os: macos-15-intel
            platform: macos-x86_64
            bundle: dmg
          - os: macos-15
            platform: macos-arm64
            bundle: dmg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf \
            xdg-utils xvfb xauth dbus-x11
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Exercise X11 window messages and hotkey grabs
        if: runner.os == 'Linux'
        env:
          HVELF_X11_TEST: '1'
        run: timeout 60s xvfb-run -a cargo test --locked --manifest-path src-tauri/Cargo.toml x11_ewmh_and_grab_against_a_real_server -- --nocapture

      - name: Build installer
        run: |
          rm -rf src-tauri/target/release/bundle
          npm run build -- --ci --bundles ${{ matrix.bundle }} -- --locked
      - name: Collect installer and build receipt
        run: node .github/scripts/release.mjs collect '${{ matrix.platform }}' '${{ matrix.bundle }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Verify packages and write checksums
        run: node .github/scripts/release.mjs finalise
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease \
            --title "hvelf $RELEASE_TAG" --notes-file .github/release-notes.md
